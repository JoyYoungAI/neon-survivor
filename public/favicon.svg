<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141838"/>
      <stop offset="100%" stop-color="#07070d"/>
    </radialGradient>

    <!-- Neon Cyan Glow -->
    <filter id="neonCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Neon Pink Glow -->
    <filter id="neonPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Wing Linear Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>

  <!-- Container with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Background Cyber Grid Lines -->
  <path d="M64 0 V512 M192 0 V512 M320 0 V512 M448 0 V512 M0 64 H512 M0 192 H512 M0 320 H512 M0 448 H512" stroke="#1c244b" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Thruster Trail / Exhaust -->
  <polygon points="256,410 236,470 256,450 276,470" fill="#ff0055" filter="url(#neonPink)"/>
  <polygon points="256,390 244,435 256,420 268,435" fill="#ffd700" opacity="0.9"/>

  <!-- Main Cyber Jet Outer Hull (Neon Cyan) -->
  <polygon points="256,64 430,410 256,340 82,410" fill="url(#cyanGrad)" filter="url(#neonCyan)"/>

  <!-- Inner Wing Panels (Dark Contrast) -->
  <polygon points="256,120 380,370 256,310 132,370" fill="#0d1124" opacity="0.85"/>

  <!-- Energy Core / Cockpit (Pure White + Laser Blue) -->
  <polygon points="256,140 330,340 256,290 182,340" fill="#ffffff" filter="url(#neonCyan)"/>

  <!-- Front Laser Tip -->
  <circle cx="256" cy="64" r="8" fill="#ffffff" filter="url(#neonCyan)"/>
</svg>
