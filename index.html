<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a14">
  <title>Neon Survivor 霓虹生存者</title>

  <!-- Google Fonts: Orbitron & Russo One & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Outfit:wght@400;600;700&family=Russo+One&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #07070d;
      color: #e0f2fe;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }

    /* Modal dialogs & overlays */
    .overlay-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 12, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: linear-gradient(145deg, #121324, #1a1b35);
      border: 1px solid rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      border-radius: 16px;
      padding: 24px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
      margin-bottom: 12px;
    }

    .screenshot-preview {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin: 12px 0 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00f0ff, #7000ff);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    .btn-primary:active {
      transform: scale(0.96);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #e0f2fe;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:active {
      transform: scale(0.96);
    }

    /* Leaderboard list styles */
    .leaderboard-list {
      max-height: 240px;
      overflow-y: auto;
      margin: 12px 0;
      text-align: left;
      font-size: 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px;
    }

    .leaderboard-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .leaderboard-row:last-child {
      border-bottom: none;
    }

    .rank-1 { color: #ffd700; font-weight: bold; }
    .rank-2 { color: #c0c0c0; font-weight: bold; }
    .rank-3 { color: #cd7f32; font-weight: bold; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Screenshot Highlight Share Modal -->
  <div id="snapshot-modal" class="overlay-modal">
    <div class="modal-card">
      <div class="modal-title">高光戰報截圖</div>
      <p style="font-size: 13px; color: #94a3b8;">已為您自動生成本局遊戲精彩戰報！</p>
      <img id="snapshot-img" class="screenshot-preview" alt="精彩截圖預覽">
      <div class="btn-group">
        <button id="btn-share-snapshot" class="btn btn-primary">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
          分享 / 儲存
        </button>
        <button id="btn-close-snapshot" class="btn btn-secondary">關閉</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
